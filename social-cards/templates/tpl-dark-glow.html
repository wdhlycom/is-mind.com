<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
  .canvas{
    position:relative;width:{{W}}px;height:{{H}}px;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(120,90,180,0.25) 0%, rgba(120,90,180,0) 55%),
      radial-gradient(100% 100% at 50% 120%, rgba(40,30,60,0.5) 0%, rgba(0,0,0,0) 60%),
      #0c0a11;
    font-family:'Cormorant Garamond',Georgia,serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .frame{position:absolute;inset:36px;border:1px solid rgba(214,188,138,0.22);pointer-events:none;}
  .glow{position:absolute;top:0;left:50%;transform:translateX(-50%);width:{{W}}px;height:440px;
    background:radial-gradient(50% 100% at 50% 0%, rgba(150,120,210,0.20), transparent 70%);pointer-events:none;}
  .content{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 110px;max-width:860px;}
  .headline{
    font-family:'Playfair Display',Georgia,serif;
    color:#d9c79a;font-size:24px;font-weight:500;letter-spacing:0.32em;
    text-transform:uppercase;margin-bottom:40px;
  }
  .rule{width:54px;height:1px;background:rgba(214,188,138,0.5);margin-bottom:40px;}
  .quote{
    color:#f3ecdd;font-size:54px;font-weight:400;font-style:italic;
    line-height:1.32;letter-spacing:0.01em;
  }
  .credit{
    margin-top:56px;color:rgba(217,199,154,0.6);font-size:16px;
    letter-spacing:0.28em;text-transform:uppercase;
    font-family:'Playfair Display',Georgia,serif;
  }
  .noise{position:absolute;inset:0;opacity:0.04;mix-blend-mode:overlay;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
</style>
</head>
<body>
<div class="canvas">
  <div class="noise"></div>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="content">
    <div class="headline">{{HEADLINE}}</div>
    <div class="rule"></div>
    <div class="quote">{{QUOTE}}</div>
    <div class="credit">{{CREDIT}}</div>
  </div>
</div>
</body>
</html>
