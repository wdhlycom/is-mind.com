<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
  .canvas{
    position:relative;width:{{W}}px;height:{{H}}px;
    background:#f3ece0;
    font-family:'Cormorant Garamond',Georgia,serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .frame{position:absolute;inset:40px;border:1px solid rgba(28,25,23,0.18);pointer-events:none;}
  .content{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 120px;max-width:840px;}
  .headline{font-family:'EB Garamond',Georgia,serif;color:#7a5c3e;font-size:22px;letter-spacing:0.34em;text-transform:uppercase;margin-bottom:38px;}
  .rule{width:60px;height:1px;background:rgba(28,25,23,0.35);margin-bottom:38px;}
  .quote{color:#1c1917;font-size:56px;font-weight:400;font-style:italic;line-height:1.3;letter-spacing:0.01em;}
  .credit{margin-top:54px;color:rgba(28,25,23,0.5);font-size:16px;letter-spacing:0.3em;text-transform:uppercase;font-family:'EB Garamond',Georgia,serif;}
</style>
</head>
<body>
<div class="canvas">
  <div class="frame"></div>
  <div class="content">
    <div class="headline">{{HEADLINE}}</div>
    <div class="rule"></div>
    <div class="quote">{{QUOTE}}</div>
    <div class="credit">{{CREDIT}}</div>
  </div>
</div>
</body>
</html>
