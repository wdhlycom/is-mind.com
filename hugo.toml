baseURL = 'https://is-mind.com/'
locale = 'en-us'
title = 'is-mind.com: The engine for your mind'
theme = 'kit'

# Multilingual: each language reads from its own content directory.
# English is the default (served at the root); zh/es get a /zh/ and /es/ prefix.
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

# Taxonomy/term pages (Tags closed-loop) are intentionally enabled.
disableKinds = []

buildFuture = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[build]
  [build.buildStats]
    enable = true

[minify]
  minifyOutput = false

ignoreLogs = ['warning-goldmark-raw-html']

[related]
  includeNewer = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "title"
    weight = 50

[params]
  # HugoBlox Core Settings
  [params.hugoblox]
    [params.hugoblox.theme]
      mode = "dark"
    [params.hugoblox.header]
      enable = true
      show_title = false
    [params.hugoblox.footer]
      enable = false
  
  # SEO Settings
  [params.seo]
    enable = true
  
  # Analytics
  [params.analytics]
    enable = false

# Main Navigation Menu
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Mind & Psych"
  url = "/psych/"
  identifier = "psych"
  weight = 10

[[menu.main]]
  name = "Tarot & Oracle"
  url = "/tarot/"
  weight = 20

[[menu.main]]
  name = "Energy & Chakras"
  url = "/energy/"
  weight = 30

[[menu.main]]
  name = "Astrology & Symbols"
  url = "/astrology/"
  weight = 40

[[menu.main]]
  name = "Reviews & Tools"
  url = "/reviews/"
  weight = 50

# Languages
[languages]
  [languages.en]
    locale = "en-us"
    label = "English"
    weight = 1
    contentDir = "content"
  [languages.zh]
    locale = "zh"
    label = "中文"
    weight = 2
    contentDir = "content/zh"
  [languages.es]
    locale = "es"
    label = "Español"
    weight = 3
    contentDir = "content/es"