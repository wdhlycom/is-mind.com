<!-- Image lightbox: click any image inside .content-block to view fullscreen + zoom/pan -->
<div id="img-lightbox" aria-hidden="true">
  <button id="lb-close" aria-label="Close">&times;</button>
  <button id="lb-zoom-out" aria-label="Zoom out">&minus;</button>
  <button id="lb-zoom-in" aria-label="Zoom in">+</button>
  <div id="lb-stage">
    <img id="lb-img" alt="">
  </div>
  <div id="lb-hint">Scroll to zoom &middot; drag to pan &middot; Esc to close</div>
</div>
<style>
  .content-block img { cursor: zoom-in; }
  #img-lightbox {
    position: fixed; inset: 0; z-index: 9999;
    display: none; align-items: center; justify-content: center;
    background: rgba(8,6,16,0.94); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .25s ease;
  }
  #img-lightbox.open { display: flex; opacity: 1; }
  #lb-stage { max-width: 92vw; max-height: 92vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #lb-img {
    max-width: 92vw; max-height: 92vh;
    transform-origin: center center; transition: transform .12s ease-out;
    will-change: transform; user-select: none; -webkit-user-drag: none;
  }
  #lb-close, #lb-zoom-in, #lb-zoom-out {
    position: absolute; width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08);
    color: #fff; font-size: 26px; line-height: 1; cursor: pointer; transition: background .2s;
  }
  #lb-close { top: 18px; right: 22px; }
  #lb-close:hover, #lb-zoom-in:hover, #lb-zoom-out:hover { background: rgba(255,255,255,.2); }
  #lb-zoom-out { bottom: 22px; right: 80px; font-size: 30px; }
  #lb-zoom-in { bottom: 22px; right: 22px; }
  #lb-hint {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.6); font-size: 13px; font-family: Georgia, serif; pointer-events: none;
  }
  @media (max-width: 640px){ #lb-hint { display: none; } }
</style>
<script>
(function(){
  var lb = document.getElementById('img-lightbox');
  if(!lb) return;
  var img = document.getElementById('lb-img');
  var stage = document.getElementById('lb-stage');
  var scale = 1, posX = 0, posY = 0, dragging = false, startX = 0, startY = 0;
  function apply(){ img.style.transform = 'translate(' + posX + 'px,' + posY + 'px) scale(' + scale + ')'; }
  function open(src, alt){
    img.src = src; img.alt = alt || '';
    scale = 1; posX = 0; posY = 0; apply();
    lb.classList.add('open'); lb.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function close(){
    lb.classList.remove('open'); lb.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
    setTimeout(function(){ img.src = ''; }, 250);
  }
  function zoom(delta, cx, cy){
    var ns = Math.min(6, Math.max(0.5, scale * delta));
    if(ns === scale) return;
    var rect = stage.getBoundingClientRect();
    var ox = (cx - rect.left - rect.width / 2);
    var oy = (cy - rect.top - rect.height / 2);
    posX = ox - (ox - posX) * (ns / scale);
    posY = oy - (oy - posY) * (ns / scale);
    scale = ns; apply();
  }
  document.addEventListener('click', function(e){
    var t = e.target;
    if(t && t.tagName === 'IMG' && t.closest('.content-block')){
      e.preventDefault();
      open(t.currentSrc || t.src, t.alt);
    }
  });
  document.getElementById('lb-close').addEventListener('click', close);
  lb.addEventListener('click', function(e){ if(e.target === lb || e.target === stage) close(); });
  lb.addEventListener('dblclick', function(e){ if(e.target === img){ scale = 1; posX = 0; posY = 0; apply(); } });
  img.addEventListener('wheel', function(e){ e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 0.87, e.clientX, e.clientY); }, { passive: false });
  document.getElementById('lb-zoom-in').addEventListener('click', function(){ var r = stage.getBoundingClientRect(); zoom(1.2, r.left + r.width / 2, r.top + r.height / 2); });
  document.getElementById('lb-zoom-out').addEventListener('click', function(){ var r = stage.getBoundingClientRect(); zoom(0.83, r.left + r.width / 2, r.top + r.height / 2); });
  img.addEventListener('mousedown', function(e){ if(scale > 1){ dragging = true; startX = e.clientX - posX; startY = e.clientY - posY; img.style.cursor = 'grabbing'; } });
  window.addEventListener('mousemove', function(e){ if(dragging){ posX = e.clientX - startX; posY = e.clientY - startY; apply(); } });
  window.addEventListener('mouseup', function(){ dragging = false; img.style.cursor = ''; });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && lb.classList.contains('open')) close(); });
})();
</script>
