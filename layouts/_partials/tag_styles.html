<style>
  /* Shared base (dark-mode) styles for every /tags/ page.

  .tag-bg-blob.b { bottom:-12%; right:-6%; width:46vw; height:46vh; background: radial-gradient(circle, rgba(210,150,180,.4), transparent 70%); animation: driftGentle 28s ease-in-out infinite reverse; }
  @keyframes cardFadeIn { 0% { opacity:0; transform: translateY(20px);} 100% { opacity:1; transform: translateY(0);} }
