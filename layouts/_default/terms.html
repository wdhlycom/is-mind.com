{{ define "main" }}
{{ partial "tag_styles.html" . }}

<div class="tags-page min-h-screen pt-3 px-4 pb-14 md:pt-4 md:px-6 md:pb-20 relative overflow-hidden bg-gradient-to-b from-[#1a1430] via-[#221a3e] to-[#150f28]">
  <div class="tag-bg-blob a"></div>
  <div class="tag-bg-blob b"></div>

  <div class="max-w-5xl mx-auto relative z-10">
    <header class="text-center pt-12 mb-6 md:pt-14 md:mb-10">
      <h1 class="text-5xl md:text-6xl font-bold text-white mb-3" style="font-family: Georgia,'Songti SC',serif;">
        <span class="title-decor text-transparent bg-clip-text bg-gradient-to-r from-[#d4c0e8] via-[#f0e0f0] to-[#c8b0d8]">Keywords</span>
      </h1>
      <p class="text-lg text-soft max-w-2xl mx-auto leading-relaxed">
        Every keyword below is generated automatically from the tags in article Front Matter.
        Tap one to see all the writings that share it.
      </p>
    </header>

    <div class="flex flex-wrap gap-3 justify-center">
      {{ range .Data.Terms.Alphabetical }}
        <a href="{{ .Page.RelPermalink }}" class="tag-pill">
          {{ .Page.Title }} <span class="count">{{ .Count }}</span>
        </a>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
