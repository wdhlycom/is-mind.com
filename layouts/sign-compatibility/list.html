{{ define "main" }}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap');

  .dc-page {
    --gold: #d4af37;
    --gold-bright: #f3d778;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #1c1030 0%, transparent 55%),
      radial-gradient(ellipse at 80% 110%, #23103a 0%, transparent 50%),
      linear-gradient(180deg, #0a0610 0%, #06040c 100%);
    position: relative;
    overflow: hidden;
    padding: 5rem 1.25rem 6rem;
  }
  .dc-stars { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .dc-star {
    position: absolute; border-radius: 50%;
    background: #fff; opacity: .5;
    animation: dcTwinkle 4s infinite ease-in-out;
  }
  @keyframes dcTwinkle { 0%,100% { opacity:.15; transform: scale(.7);} 50% { opacity:.9; transform: scale(1.2);} }

  .dc-inner { position: relative; z-index: 2; max-width: 720px; margin: 0 auto; text-align: center; }

  .dc-title {
    font-family: 'Cinzel', Georgia, serif; font-weight: 700;
    font-size: clamp(2rem, 5vw, 3.1rem); line-height: 1.15;
    letter-spacing: .02em; margin: 0 0 .6rem;
    background: linear-gradient(90deg, #e8d8b8, var(--gold-bright), #c0a880);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .dc-sub {
    font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic;
    font-size: clamp(1rem, 2.4vw, 1.25rem); color: rgba(223,214,193,.72);
    max-width: 34rem; margin: 0 auto 2.4rem;
  }

  .dc-row { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; align-items: center; margin-bottom: 1.6rem; }
  .dc-field {
    font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.1rem;
    color: #f3ead0; background: rgba(255,255,255,.04);
    border: 1px solid rgba(212,175,55,.35); border-radius: 12px;
    padding: .8rem 1rem; min-width: 12rem; outline: none; cursor: pointer;
    transition: border-color .3s ease, box-shadow .3s ease;
  }
  .dc-field:focus { border-color: var(--gold-bright); box-shadow: 0 0 18px rgba(212,175,55,.25); }
  .dc-plus { font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--gold-bright); }

  .dc-btn {
    display: inline-flex; align-items: center; gap: .5rem;
    font-family: 'Cinzel', serif; font-weight: 600; font-size: 1rem; letter-spacing: .06em;
    padding: .95rem 2.4rem; border-radius: 9999px; cursor: pointer;
    color: #1a1206; border: none;
    background: linear-gradient(90deg, var(--gold), var(--gold-bright));
    box-shadow: 0 0 30px rgba(212,175,55,.35);
    transition: transform .25s ease, box-shadow .25s ease, opacity .25s ease;
  }
  .dc-btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 45px rgba(212,175,55,.6); }
  .dc-btn:active { transform: scale(.98); }
  .dc-btn:disabled { opacity: .5; cursor: not-allowed; }

  .dc-result {
    max-width: 560px; margin: 2.6rem auto 0;
    opacity: 0; transform: translateY(20px);
    transition: opacity .7s ease, transform .7s ease;
    pointer-events: none;
  }
  .dc-result.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .dc-pair { font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.4rem; color: var(--gold-bright); margin: 0 0 .3rem; }
  .dc-pair .dc-emoji { font-size: 1.8rem; vertical-align: middle; margin: 0 .3rem; }
  .dc-score {
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: clamp(2.6rem, 10vw, 4.4rem); line-height: 1; margin: .2rem 0 .4rem;
    background: linear-gradient(90deg, var(--gold-bright), #fff3cf, var(--gold-bright));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .dc-bar { width: 100%; max-width: 22rem; height: 10px; border-radius: 9999px; margin: 0 auto 1.2rem; background: rgba(255,255,255,.08); overflow: hidden; }
  .dc-bar-fill { height: 100%; width: 0; border-radius: 9999px; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); transition: width 1s cubic-bezier(.4,.2,.2,1); }
  .dc-oracle {
    font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic;
    font-size: 1.25rem; line-height: 1.6; color: rgba(243,215,120,.9);
    max-width: 34rem; margin: 0 auto 1.6rem;
  }
  .dc-divider { width: 90px; height: 1px; margin: 1.4rem auto; background: linear-gradient(90deg, transparent, rgba(212,175,55,.6), transparent); }
  .dc-cta { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.08rem; line-height: 1.6; color: rgba(210,200,180,.78); max-width: 40rem; margin: 0 auto; }
  .dc-cta a { color: var(--gold-bright); font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(243,215,120,.5); }
  .dc-cta a:hover { color: #fff; border-color: #fff; }

  html:not(.dark) .dc-page { background: radial-gradient(ellipse at 50% -10%, #ece3fb 0%, transparent 55%), linear-gradient(180deg, #f8f6fc 0%, #fbfaff 100%); }
  html:not(.dark) .dc-sub { color: #5b5470; }
  html:not(.dark) .dc-star { background: #7c3aed; }
  html:not(.dark) .dc-field { color: #2a2342; background: rgba(124,58,237,.04); border-color: rgba(124,58,237,.3); }
  html:not(.dark) .dc-oracle { color: #3b2f63; }
  html:not(.dark) .dc-cta { color: #5b5470; }
  html:not(.dark) .dc-cta a { color: #7c3aed; border-color: rgba(124,58,237,.4); }
  html:not(.dark) .dc-cta a:hover { color: #4c1d95; border-color: #4c1d95; }
</style>

<div class="dc-page">
  <div class="dc-stars" id="dcStars"></div>

  <div class="dc-inner">
    <h1 class="dc-title">Sign Compatibility</h1>
    <p class="dc-sub">Choose two signs and see how their elements flow together.</p>

    <div class="dc-row">
      <select id="dcA" class="dc-field"></select>
      <span class="dc-plus">+</span>
      <select id="dcB" class="dc-field"></select>
    </div>
    <div><button class="dc-btn" id="dcBtn">💞 See the Match</button></div>

    <div class="dc-result" id="dcResult">
      <p class="dc-pair" id="dcPair"></p>
      <div class="dc-score" id="dcScore"></div>
      <div class="dc-bar"><div class="dc-bar-fill" id="dcBar"></div></div>
      <p class="dc-oracle" id="dcOracle"></p>
      <div class="dc-divider"></div>
      <p class="dc-cta">
        Curious about the rest of your chart? Start with the
        <a href="{{ "/oracle/" | relURL }}">Daily Oracle</a> or ask the
        <a href="{{ "/yes-no-tarot/" | relURL }}">Yes / No Tarot</a>.
      </p>
    </div>
  </div>
</div>

<script>
(function () {
  var SIGNS = [
    ["Aries","♈"],["Taurus","♉"],["Gemini","♊"],["Cancer","♋"],
    ["Leo","♌"],["Virgo","♍"],["Libra","♎"],["Scorpio","♏"],
    ["Sagittarius","♐"],["Capricorn","♑"],["Aquarius","♒"],["Pisces","♓"]
  ];
  var ELEMENT = { Aries:"Fire",Taurus:"Earth",Gemini:"Air",Cancer:"Water",Leo:"Fire",Virgo:"Earth",Libra:"Air",Scorpio:"Water",Sagittarius:"Fire",Capricorn:"Earth",Aquarius:"Air",Pisces:"Water" };

  function score(a, b) {
    if (a === b) return 90 + ((a.length * 3) % 7);
    var ea = ELEMENT[a], eb = ELEMENT[b], base;
    if (ea === eb) base = 84;
    else if ((ea==="Fire"&&eb==="Air")||(ea==="Air"&&eb==="Fire")) base = 80;
    else if ((ea==="Earth"&&eb==="Water")||(ea==="Water"&&eb==="Earth")) base = 80;
    else if ((ea==="Air"&&eb==="Water")||(ea==="Water"&&eb==="Air")) base = 72;
    else if ((ea==="Air"&&eb==="Earth")||(ea==="Earth"&&eb==="Air")) base = 70;
    else if ((ea==="Fire"&&eb==="Water")||(ea==="Water"&&eb==="Fire")) base = 66;
    else if ((ea==="Fire"&&eb==="Earth")||(ea==="Earth"&&eb==="Fire")) base = 68;
    else base = 70;
    var variation = ((SIGNS.findIndex(function(s){return s[0]===a;}) * 7 + SIGNS.findIndex(function(s){return s[0]===b;}) * 13) % 11) - 5;
    return Math.max(45, Math.min(98, base + variation));
  }

  function message(s, ea, eb) {
    if (s >= 85) return "A naturally flowing pair — your elements speak the same language.";
    if (s >= 75) return "Strong potential. A little effort turns attraction into real ease.";
    if (s >= 65) return "Worth exploring. Differences ask for patience, not avoidance.";
    return "An unlikely match that can work if you both choose curiosity over comfort.";
  }

  var selA = document.getElementById('dcA');
  var selB = document.getElementById('dcB');
  var btn = document.getElementById('dcBtn');
  var result = document.getElementById('dcResult');
  var pairEl = document.getElementById('dcPair');
  var scoreEl = document.getElementById('dcScore');
  var barEl = document.getElementById('dcBar');
  var oracleEl = document.getElementById('dcOracle');
  var calc = false;

  SIGNS.forEach(function (s, i) {
    var o1 = document.createElement('option'); o1.value = s[0]; o1.textContent = s[1] + ' ' + s[0]; selA.appendChild(o1);
    var o2 = document.createElement('option'); o2.value = s[0]; o2.textContent = s[1] + ' ' + s[0]; selB.appendChild(o2);
  });
  selA.selectedIndex = 0;   // Aries
  selB.selectedIndex = 6;   // Libra

  (function () {
    var wrap = document.getElementById('dcStars');
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 60; i++) {
      var st = document.createElement('div');
      st.className = 'dc-star';
      var size = (Math.random() * 2 + 1).toFixed(1);
      st.style.width = size + 'px'; st.style.height = size + 'px';
      st.style.left = (Math.random() * 100).toFixed(2) + '%';
      st.style.top = (Math.random() * 100).toFixed(2) + '%';
      st.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
      frag.appendChild(st);
    }
    wrap.appendChild(frag);
  })();

  function calcMatch() {
    if (calc) return;
    calc = true;
    btn.disabled = true;
    result.classList.remove('show');
    barEl.style.width = '0%';

    var a = selA.value, b = selB.value;
    var emojiA = SIGNS.filter(function(s){return s[0]===a;})[0][1];
    var emojiB = SIGNS.filter(function(s){return s[0]===b;})[0][1];
    var s = score(a, b);

    setTimeout(function () {
      pairEl.innerHTML = emojiA + ' ' + a + ' <span style="opacity:.6">×</span> ' + emojiB + ' ' + b;
      scoreEl.textContent = s + '%';
      barEl.style.width = s + '%';
      oracleEl.textContent = message(s, ELEMENT[a], ELEMENT[b]);
      result.classList.add('show');
      btn.textContent = '🔄 Recalculate';
      btn.disabled = false;
      calc = false;
    }, 420);
  }

  btn.addEventListener('click', calcMatch);
})();
</script>
{{ end }}
